# NGINX con HTTPS para el servidor de AWS (saesu.duckdns.org).
# Solo lo usa docker-compose.https.yml; en local sigue nginx.conf con HTTP.
# Certificado gratuito de Let's Encrypt en /etc/letsencrypt (montado desde el servidor).

# HTTP: responde el reto de Let's Encrypt (para renovar) y manda todo lo demás a HTTPS
server {
    listen 80;
    server_name saesu.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name saesu.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/saesu.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saesu.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # El navegador recuerda usar siempre HTTPS (1 día; se puede subir cuando todo esté estable)
    add_header Strict-Transport-Security "max-age=86400" always;

    # Fotos de perfil e imágenes del foro: mismo límite que el backend (10 MB)
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://saesu-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El tutor IA (Gemini) puede tardar hasta un minuto en contestar
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
