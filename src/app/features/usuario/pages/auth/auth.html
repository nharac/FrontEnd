<!-- Fondo decorativo: símbolos de cálculo que flotan -->
<div class="auth-fondo" aria-hidden="true">
  <span class="auth-mancha auth-mancha--1"></span>
  <span class="auth-mancha auth-mancha--2"></span>
  <span class="auth-mancha auth-mancha--3"></span>
  @for (s of simbolos; track $index) {
    <span class="auth-simbolo">{{ s }}</span>
  }
</div>

<div class="container" [class.active]="modoRegistro()">

  <!-- Formulario de login -->
  <div class="form-container sign-in">
    <app-login-form (cambiarModo)="toggleModo()"></app-login-form>
  </div>

  <!-- Formulario de registro -->
  <div class="form-container sign-up">
    <app-registro-form (cambiarModo)="toggleModo()"></app-registro-form>
  </div>

  <!-- Panel deslizante -->
  <div class="toggle-container">
    <div class="toggle">
      <span class="burbuja-panel burbuja-panel--1" aria-hidden="true"></span>
      <span class="burbuja-panel burbuja-panel--2" aria-hidden="true"></span>
      <span class="burbuja-panel burbuja-panel--3" aria-hidden="true"></span>
      <div class="toggle-panel toggle-left">
        <app-mascota class="toggle-panel__sumi" estado="feliz" [tamano]="96" />
        <h2>¡Hola de nuevo!</h2>
        <p>Si ya tienes una cuenta, inicia sesión aquí</p>
        <button type="button" class="btn btn-transparent" (click)="toggleModo()">
          <mat-icon>arrow_back</mat-icon> Iniciar sesión
        </button>
      </div>
      <div class="toggle-panel toggle-right">
        <app-mascota class="toggle-panel__sumi" estado="saludo" [tamano]="96" />
        <h2>¡Bienvenido a SAESU!</h2>
        <p>Regístrate con tu correo institucional para comenzar</p>
        <button type="button" class="btn btn-transparent" (click)="toggleModo()">
          Crear cuenta <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </div>
  </div>

</div>
