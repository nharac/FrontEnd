<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h1>Iniciar sesión</h1>
  <p class="subtitle">Accede a tu cuenta de SAESU</p>

  <div class="input-group">
    <mat-icon>mail</mat-icon>
    <input type="email" placeholder="Correo" formControlName="correo">
  </div>
  <small class="error" *ngIf="correo?.invalid && correo?.touched">
    Ingresa un correo válido
  </small>

  <div class="input-group">
    <mat-icon>lock</mat-icon>
    <input [type]="mostrarPassword() ? 'text' : 'password'"
           placeholder="Contraseña" formControlName="password">
    <mat-icon class="toggle-password" (click)="toggleMostrarPassword()">
      {{ mostrarPassword() ? 'visibility_off' : 'visibility' }}
    </mat-icon>
  </div>
  <small class="error" *ngIf="password?.invalid && password?.touched">
    La contraseña debe tener mínimo 8 caracteres
  </small>

  <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>

  <button type="submit" class="btn" [disabled]="cargando()">
    {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
  </button>
</form>
