<nav class="navbar">
  <a class="navbar__brand" routerLink="/docente" aria-label="SAESU, ir al inicio">
    <app-logo [size]="36" />
    <span class="navbar__texto">
      <span class="navbar__logo">SAESU</span>
      <span class="navbar__tagline">Módulo Docente</span>
    </span>
  </a>

  <ul class="navbar__links">
    <li>
      <a routerLink="/docente" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>dashboard</mat-icon>
        <span>Inicio</span>
      </a>
    </li>
    <li>
      <a routerLink="/docente/notificaciones" routerLinkActive="active"
         [attr.aria-label]="'Consultas pendientes' + (pendientes() ? ': ' + pendientes() : '')">
        <span class="icono-badge">
          <mat-icon>notifications</mat-icon>
          @if (pendientes()) {
            <b class="badge">{{ pendientes()! > 99 ? '99+' : pendientes() }}</b>
          }
        </span>
        <span>Consultas</span>
      </a>
    </li>
    <li>
      <a routerLink="/docente/estudiantes" routerLinkActive="active">
        <mat-icon>groups</mat-icon>
        <span>Estudiantes</span>
      </a>
    </li>
    <li>
      <a routerLink="/docente/estadisticas" routerLinkActive="active">
        <mat-icon>insights</mat-icon>
        <span>Estadísticas</span>
      </a>
    </li>
    <li>
      <a routerLink="/docente/preguntas" routerLinkActive="active">
        <mat-icon>quiz</mat-icon>
        <span>Preguntas</span>
      </a>
    </li>
    <li>
      <a routerLink="/docente/foro" routerLinkActive="active">
        <mat-icon>forum</mat-icon>
        <span>Foro</span>
      </a>
    </li>
  </ul>

  <button class="navbar__user" [matMenuTriggerFor]="menu">
    <span class="navbar__avatar">{{ iniciales() }}</span>
    <span class="navbar__name">{{ nombreDocente() }}</span>
    <mat-icon>expand_more</mat-icon>
  </button>

  <mat-menu #menu="matMenu" xPosition="before">
    <button mat-menu-item routerLink="/docente/moderacion">
      <mat-icon>shield</mat-icon>
      <span>Moderación del foro</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</nav>
