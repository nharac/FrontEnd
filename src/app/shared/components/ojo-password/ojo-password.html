<button type="button" class="ojo" [class.ojo--visible]="visible()"
        [class.parpadeo-a]="parpadeo() === 'a'" [class.parpadeo-b]="parpadeo() === 'b'"
        [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="visible()"
        [title]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        (click)="clic()">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <g class="ojo__globo">
      <path class="ojo__contorno" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
      <circle class="ojo__pupila" cx="12" cy="12" r="3" />
    </g>
    <!-- Hueco blanco + línea: tachan el ojo cuando la contraseña está a la vista -->
    <line class="ojo__hueco" x1="4" y1="4" x2="20" y2="20" pathLength="1" />
    <line class="ojo__tachon" x1="4" y1="4" x2="20" y2="20" pathLength="1" />
  </svg>
</button>
