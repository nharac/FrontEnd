<nav class="navbar">
  <a class="navbar__brand" routerLink="/dashboard" aria-label="SAESU, ir al inicio">
    <app-logo [size]="36" />
    <span class="navbar__texto">
      <span class="navbar__logo">SAESU</span>
      <span class="navbar__tagline">Portal Estudiantil</span>
    </span>
  </a>

  <ul class="navbar__links">
    <li>
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>home</mat-icon>
        <span>Inicio</span>
      </a>
    </li>
    <li>
      <a routerLink="/practica" routerLinkActive="active">
        <mat-icon>edit_note</mat-icon>
        <span>Práctica</span>
      </a>
    </li>
    <li>
      <a routerLink="/chat" routerLinkActive="active">
        <mat-icon>smart_toy</mat-icon>
        <span>Chat Tutor</span>
      </a>
    </li>
    <li class="nav-extra">
      <a routerLink="/retos" routerLinkActive="active">
        <mat-icon>sports_kabaddi</mat-icon>
        <span>Retos</span>
      </a>
    </li>
    <li class="nav-extra">
      <a routerLink="/resueltos" routerLinkActive="active">
        <mat-icon>menu_book</mat-icon>
        <span>Resueltos</span>
      </a>
    </li>
    <li>
      <a routerLink="/quiz" routerLinkActive="active">
        <mat-icon>timer</mat-icon>
        <span>Quiz</span>
      </a>
    </li>
    <li class="nav-extra">
      <a routerLink="/foro" routerLinkActive="active">
        <mat-icon>forum</mat-icon>
        <span>Foro</span>
      </a>
    </li>
    <li class="nav-extra">
      <a routerLink="/ranking" routerLinkActive="active">
        <mat-icon>leaderboard</mat-icon>
        <span>Ranking</span>
      </a>
    </li>
    <li class="nav-mas">
      <button type="button" [matMenuTriggerFor]="mas" aria-label="Más secciones">
        <mat-icon>more_horiz</mat-icon>
        <span>Más</span>
      </button>
    </li>
  </ul>

  <app-boton-tema class="navbar__tema" />
  <app-campanita class="navbar__campana" />

  <button class="navbar__user" [matMenuTriggerFor]="menu">
    <span class="navbar__caja">
      @if (fotoUrl(); as url) {
        <img class="navbar__avatar navbar__avatar--foto" [src]="url" alt="">
      } @else {
        <span class="navbar__avatar">{{ inicial }}</span>
      }
      <app-medalla [lugar]="miLugar()" tamano="sm" />
    </span>
    <span class="navbar__name">{{ nombreUsuario() }}</span>
    <mat-icon>expand_more</mat-icon>
  </button>

  <mat-menu #mas="matMenu" yPosition="above">
    <button mat-menu-item routerLink="/retos">
      <mat-icon>sports_kabaddi</mat-icon>
      <span>Retos</span>
    </button>
    <button mat-menu-item routerLink="/resueltos">
      <mat-icon>menu_book</mat-icon>
      <span>Resueltos</span>
    </button>
    <button mat-menu-item routerLink="/foro">
      <mat-icon>forum</mat-icon>
      <span>Foro</span>
    </button>
    <button mat-menu-item routerLink="/ranking">
      <mat-icon>leaderboard</mat-icon>
      <span>Ranking</span>
    </button>
  </mat-menu>

  <mat-menu #menu="matMenu" xPosition="before">
    <button mat-menu-item routerLink="/perfil">
      <mat-icon>person</mat-icon>
      <span>Mi perfil</span>
    </button>
    <mat-divider />
    <button mat-menu-item (click)="$event.stopPropagation(); a11y.alternar('textoGrande')" role="menuitemcheckbox" [attr.aria-checked]="a11y.textoGrande()">
      <mat-icon>{{ a11y.textoGrande() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
      <span>Texto más grande</span>
    </button>
    <button mat-menu-item (click)="$event.stopPropagation(); a11y.alternar('altoContraste')" role="menuitemcheckbox" [attr.aria-checked]="a11y.altoContraste()">
      <mat-icon>{{ a11y.altoContraste() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
      <span>Alto contraste</span>
    </button>
    <button mat-menu-item (click)="$event.stopPropagation(); a11y.alternar('sinAnimaciones')" role="menuitemcheckbox" [attr.aria-checked]="a11y.sinAnimaciones()">
      <mat-icon>{{ a11y.sinAnimaciones() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
      <span>Sin animaciones</span>
    </button>
    <mat-divider />
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</nav>
