
server {
    listen 80;
    server_name localhost;

    # Fotos de perfil e imágenes del foro: mismo límite que el backend (10 MB)
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir JS, CSS y respuestas JSON de la API (~630 kB de la carga inicial bajan a ~150 kB)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://saesu-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre (Angular los renombra en cada build): cache de 1 año
    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
