# Integración continua del frontend de SAESU.
# En cada push o Pull Request a las ramas principales: instala dependencias, corre las pruebas
# unitarias con cobertura, compila para producción, analiza con SonarQube (si hay token)
# y construye la imagen Docker con nginx.
name: CI frontend

on:
  push:
    branches: [desarrollo, preproduccion, main]
  pull_request:
    branches: [desarrollo, preproduccion, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Probar y compilar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias y cobertura
        run: npm run test:cov

      - name: Compilar para producción
        run: npm run build

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/
          retention-days: 14

      # Solo corre si existen los secretos SONAR_TOKEN y SONAR_HOST_URL (ver CI del backend).
      - name: Análisis SonarQube
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t saesu-frontend:${{ github.sha }} .
