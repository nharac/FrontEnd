# Análisis de SonarQube del frontend (Angular 22).
# 1) npm run test:cov            -> genera coverage/FrontEnd/lcov.info
# 2) docker run --rm --network saesu-network -e SONAR_HOST_URL=http://saesu-sonarqube:9000 \
#      -e SONAR_TOKEN=<token> -v "${PWD}:/usr/src" sonarsource/sonar-scanner-cli
sonar.projectKey=saesu-frontend
sonar.projectName=SAESU Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.inclusions=src/**
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.testing.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.testing.ts,src/environments/**,public/**

sonar.javascript.lcov.reportPaths=coverage/FrontEnd/lcov.info
# Modelos, rutas y configuración no tienen lógica que probar
sonar.coverage.exclusions=**/*.model.ts,**/*.routes.ts,**/*.config.ts,src/main.ts
